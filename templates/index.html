
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的部落格</title>
</head>
<body>
    <h1>我的 Flask 部落格</h1>

    <a href="{{ url_for('add') }}">新增文章</a>

    <hr>

    {% for post in posts %}
        <h2>
            <a href="{{ url_for('post', post_id=loop.index0) }}">
                {{ post.title }}
            </a>
        </h2>

        <p>作者：{{ post.author }}</p>
        <hr>
    {% endfor %}
</body>
</html>
